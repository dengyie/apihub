name: Build Release

# 上游 release.yml 只在打 tag 时跑，且默认用 runner 的隐式架构（amd64）——本仓库的
# 生产机 tebi 是 x86_64，而本地 Mac 是 arm64，两者一混就会把 aarch64 的二进制推上
# x86_64，内核直接 Exec format error。这里把架构变成矩阵里的显式声明，并在上传
# 产物之前校验 ELF e_machine，让「编错架构」在 CI 就红，而不是在生产炸。

on:
  push:
    branches: [main, loadbalancer-v29.1]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # 生产机 tebi：x86_64。这是唯一必须正确的产物。
          - goarch: amd64
            elf_machine: 62   # EM_X86_64
          - goarch: arm64
            elf_machine: 183  # EM_AARCH64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Resolve version
        # 前后端版本号必须同源。Go 侧的版本串在下面的 Build 步骤里由
        # `$(cat VERSION)` + commit 推出；前端此前是写死的字面量，改 VERSION
        # 时只记得改一边，于是同一个部署里 /api/status 报 v29.22+abc 而前端
        # build rev 里嵌着 v29.21 —— 正是 v29.16 引入「版本串绑定 commit」要
        # 消灭的那类事后无法判断。这里把 VERSION 注入成环境变量，删掉字面量。
        run: |
          set -euo pipefail
          echo "VITE_REACT_APP_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
          echo "resolved VITE_REACT_APP_VERSION=$(cat VERSION)"

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        # 必须真构建，不能占位：`web/dist` 被 .gitignore 排除、git 里 0 个跟踪
        # 文件，而 main.go 是 `//go:embed web/dist`。只 mkdir + touch 一个空
        # index.html，go build 会顺利通过、产出一个**没有前端**的二进制，线上
        # 表现为首页返回 200 但正文 0 字节（后台白屏）——光看状态码查不出来。
        # main.go 的 verifyEmbeddedFrontend 与 Makefile 的 verify-embed 现在也
        # 各自守着同一道闸门，三处阈值必须一起改。
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: bun run build

      - name: Verify frontend bundle is not a placeholder
        run: |
          set -euo pipefail
          if [ ! -f web/dist/index.html ]; then
            echo "::error::web/dist/index.html 不存在：前端没有被打进二进制"
            exit 1
          fi
          size=$(wc -c < web/dist/index.html)
          if [ "$size" -lt 200 ]; then
            echo "::error::index.html 仅 ${size} 字节，疑似占位文件；真实构建约 1KB"
            exit 1
          fi
          if [ ! -d web/dist/static ]; then
            echo "::error::web/dist/static 缺失：前端资源目录不存在"
            exit 1
          fi
          assets=$(find web/dist/static -type f | wc -l)
          echo "index.html ${size} 字节，static 资源 ${assets} 个文件"
          if [ "$assets" -lt 10 ]; then
            echo "::error::static 资源只有 ${assets} 个，远少于真实构建应有的数量"
            exit 1
          fi

      - name: Build
        id: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          # 纯 Go 静态二进制：无需交叉 C 工具链，也就不会因为本地缺 toolchain 而
          # 悄悄回退到宿主架构。
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          base="$(cat VERSION)"
          sha="$(git rev-parse --short=9 HEAD)"
          version="${base}+${sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          go build \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${version}'" \
            -o "new-api-${version}-linux-${GOARCH}"
          ls -la "new-api-${version}-linux-${GOARCH}"

      - name: Verify target architecture
        # 上传产物之前必须证明 ELF 头里的 e_machine 就是矩阵声明的那个。
        # 读取字节偏移 18..19（小端 u16）并与期望值比对，不依赖 file(1) 的措辞。
        run: |
          set -euo pipefail
          bin="new-api-${{ steps.build.outputs.version }}-linux-${{ matrix.goarch }}"
          # xargs 负责把 od 的多空格与换行规整成单个空格分隔的 "62 0"。
          machine="$(od -An -tu1 -j 18 -N 2 "$bin" | xargs)"
          echo "e_machine bytes: ${machine} (期望 ${{ matrix.elf_machine }} 0)"
          if [ "$machine" != "${{ matrix.elf_machine }} 0" ]; then
            echo "::error::架构不匹配：$bin 不是 ${{ matrix.goarch }}，拒绝上传"
            exit 1
          fi
          file "$bin" || true

      - name: Verify frontend is embedded in the binary
        # 产物级断言。上面那道 dist 闸门检查的是构建目录，这里检查的是最终二进制：
        # `go:embed` 在哪一步静默跳过、哪一步把空文件打进去，只有对成品 grep 才抓得到。
        run: |
          set -euo pipefail
          bin="new-api-${{ steps.build.outputs.version }}-linux-${{ matrix.goarch }}"
          if ! grep -aq 'static/js/index\.' "$bin"; then
            echo "::error::$bin 里找不到前端 bundle 标记，产出的很可能是个没有界面的二进制"
            exit 1
          fi
          echo "二进制内含前端 bundle 标记"

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: new-api-linux-${{ matrix.goarch }}
          path: new-api-${{ steps.build.outputs.version }}-linux-${{ matrix.goarch }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: new-api-${{ steps.build.outputs.version }}-linux-${{ matrix.goarch }}