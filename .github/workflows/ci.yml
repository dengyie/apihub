name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  # This repo ships by pushing straight to main -- there are no review PRs to
  # lean on -- so a pull_request-only CI ran zero times for the code that
  # actually deploys to production. That is why the deploy suite below sat in
  # the repo while the rollback path it covers shipped untested.
  push:
    branches: [main]
  # The deploy workflow calls this one as its gate. It was added because
  # `needs:` cannot cross workflow boundaries, so deploy.yml could not depend on
  # this run directly -- the two fired on the same push, concurrently, in no
  # defined order, and a red CI did nothing at all to stop the binary from
  # reaching production. Calling it makes the ordering explicit and unskippable.
  workflow_call:

permissions:
  contents: read

# github.workflow is the CALLER's name for a reusable workflow, so the deploy
# gate's runs get group ci-Deploy-<ref> while a standalone CI run gets
# ci-CI-<ref>. That separation is deliberate and is what keeps cancel-in-progress
# from letting a hand-triggered CI run cancel the gate the deploy is waiting on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `|| github.repository` is load-bearing now that this workflow is also
          # called as a reusable gate. On a pull_request event the first operand
          # resolves; on the push and workflow_call events that reach it from
          # deploy.yml there is no pull_request object at all, so it evaluates to
          # empty and actions/checkout is handed repository: "" -- which is not
          # the same as omitting the input, and fails the checkout.
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

      # The deployment script is not exercised by `make test`, and nothing else
      # ran these either: --rollback and --bootstrap had zero coverage because
      # the suite that would have covered them was only ever run by hand, on the
      # machine of whoever last changed it. Both paths are the ones that run when
      # a deploy has already gone wrong.
      - name: Test the deploy script
        run: bash scripts/deploy_test.sh

      - name: Check the deployment layout has no second copy
        run: bash scripts/check-deploy-refs.sh

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `|| github.repository` is load-bearing now that this workflow is also
          # called as a reusable gate. On a pull_request event the first operand
          # resolves; on the push and workflow_call events that reach it from
          # deploy.yml there is no pull_request object at all, so it evaluates to
          # empty and actions/checkout is handed repository: "" -- which is not
          # the same as omitting the input, and fails the checkout.
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
