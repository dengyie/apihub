# new-api 智能负载策略配置
# 修改后 5 秒内自动热加载生效，无需重启服务。
#
# enabled: 总开关，false 时全部逻辑旁路，行为与原生 new-api 一致

enabled: false

# 默认策略（所有渠道生效，可被 channels 中的单渠道配置覆盖）
default:
  # 单渠道最大并发请求数，超过后新请求自动跳过该渠道，落到低优先级
  # 0 = 不限制
  max_inflight: 50

  # 首字超时（毫秒）：流式请求超过此时长未收到首个 token，
  # 视为慢请求：计入熔断 + 触发重试到下一个渠道
  # 0 = 不启用
  ttft_timeout_ms: 15000

  breaker:
    # 连续慢请求/失败达到此次数后熔断
    failure_threshold: 5
    # 熔断冷却时间（秒），之后进入半开状态允许探测
    cooldown_seconds: 60
    # 半开状态允许的探测请求数
    half_open_probes: 1
    # 熔断粒度（v29.11 新增）：
    #   false / 不填（默认）= 熔整个渠道，一个模型失败全部模型下线
    #   true                = 熔 (渠道, 模型) 这一对，同渠道其它模型照常
    #
    # 只有可证明是账号 / 密钥 / 中继级的问题（额度耗尽、宵禁、401、
    # 分组无权、中继代理故障、上游限流）才熔整渠道；模型不存在、模型
    # EOL、思考模式不兼容、传输中断、空流等一律只熔该模型。
    #
    # 注意 max_inflight 不受此影响：并发上限始终按渠道计，因为它是上游
    # 账号的并发预算，不是单模型的。
    #
    # 这是热加载项：改完 5 秒内生效，无需重启。代码默认关闭（等价旧行为），
    # 确认无误后再改成 true 打开；出问题改回 false 同样即时。
    per_model: false

# 单渠道覆盖，key 为渠道 ID
# 示例：
# channels:
#   123:  # cpa-zhe
#     max_inflight: 20
#     ttft_timeout_ms: 8000
channels: {}
